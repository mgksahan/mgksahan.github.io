<!doctype html>
<html lang="en">
  <head>
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which will allow the SPA router to resolve the route.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
    <script>
      if (typeof global === 'undefined') {
        window.global = window;
      }
    </script>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Favicons -->
    <link rel="icon" href="/favicon-black.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
    <link rel="icon" href="/favicon-white.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/favicon-black-32.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)">
    <link rel="icon" href="/favicon-white-32.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)">

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fitness" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#060912" />
    <link rel="apple-touch-icon" href="/favicon-black-180.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/favicon-white-180.png" media="(prefers-color-scheme: dark)" />
    <style>
      /* Installed-app feel: no pull-to-refresh bounce, and a splash until the app has mounted */
      @media (display-mode: standalone) { html, body { overscroll-behavior-y: none; } }
      #splash { display: none; position: fixed; inset: 0; z-index: 9999; background: #0d0e10; align-items: center; justify-content: center; transition: opacity .35s ease; }
      .standalone #splash { display: flex; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 96px; height: 96px; border-radius: 22px; animation: splashPulse 1.4s ease-in-out infinite; }
      @keyframes splashPulse { 0%, 100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.06); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
    </style>
    <script>
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        document.documentElement.classList.add('standalone');
      }
    </script>
    <title>Sahan Gamage | I make systems talk to each other</title>
    <meta name="description" content="I make systems talk to each other. I build the pipelines that carry data from where it's born to where it's useful. Quick to ship, light to run, ready to scale." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img id="splash-img" alt="" /></div>
    <script>
      document.getElementById('splash-img').src = location.pathname.indexOf('/gym') === 0 ? '/dumbbell_icon.png' : '/favicon-white-180.png';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
